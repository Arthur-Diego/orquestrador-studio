<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orquestrador Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="eyebrow">Orquestrador</span><h1>Studio</h1></div>
    <section class="proj">
      <label class="eyebrow" for="projSel">Projeto</label>
      <div class="row">
        <select id="projSel"></select>
        <button id="btnNewProj" class="ghost" title="Novo projeto">+</button>
      </div>
      <form id="newProj" class="newproj hidden">
        <input id="npName" placeholder="Nome (ex.: Gelo Zero)" required>
        <input id="npProduct" placeholder="Produto (ex.: energy drink)">
        <input id="npVibe" placeholder="Vibe (ex.: snow neon)">
        <div class="row"><button type="submit">Criar</button><button type="button" id="npCancel" class="ghost">Cancelar</button></div>
      </form>
    </section>
    <nav>
      <div class="eyebrow">Etapas do curso</div>
      <ol id="steps"></ol>
    </nav>
  </aside>

  <main id="main"><div class="empty">Carregando…</div></main>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
