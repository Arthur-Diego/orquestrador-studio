name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # 10 min era o teto original e já vinha raspando: os runs da wave 10 marcaram 8m27s e
    # 9m16s ANTES de a suíte crescer. Com +145 testes (frentes 03 e 04) o job passou de 10
    # min e foi cancelado — falha de orçamento, não de teste. 20 min dá folga real: a suíte
    # roda em ~3,5 min local; o resto é apt-get do ffmpeg, setup do Python e pip.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ffmpeg (fixtures de vídeo/áudio dos testes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check studio tests scripts

      - name: Testes (pytest)
        # Sem rede e sem navegador: os testes cobrem serviços, API e ponte do CLI com fakes.
        run: pytest
