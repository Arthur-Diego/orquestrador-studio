<style>
  /* Lacunas do catálogo do shell — escopo `.pb-` da etapa 9.
     `.rowlist` do shell tem gap 10px; o protótipo desenha a lista de publicações com 8px. */
  .pb-form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .pb-form:last-of-type{margin-bottom:0}
  .pb-form .grow-lg{min-width:240px}
  #pubNetwork{width:170px}
  .pb-com{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 0}
  #pubLog{gap:8px;margin-bottom:14px}
  #pubLog:empty{margin-bottom:0}
  /* A nota da linha é texto até ser clicada: o campo herda a fonte e não desenha caixa. */
  .pub-row .del{margin-left:auto}
  .pub-row .nt{cursor:text}
  .pub-row .nt-edit{width:100%;min-width:200px;background:transparent;border:0;border-bottom:1px solid var(--accent);border-radius:0;padding:0;font:inherit;font-size:var(--fs-fine);color:var(--ink-2)}
  .pub-row .nt-edit:focus{outline:none;box-shadow:none}
</style>

<header class="stephead">
  <span class="eyebrow">Etapa 9 · aula 015</span>
  <h2>Publicar</h2>
  <p class="lede">Publique à mão na interface de cada rede e registre o link. Dever de casa: <strong>4 vídeos publicados</strong> antes de prospectar — prática, exposição e validação.</p>
</header>

<section id="guide" class="guide"></section>

<section class="panel">
  <div class="panel-head">
    <h3><span class="pn">01</span>Registrar uma publicação</h3>
  </div>
  <div class="pb-form">
    <select id="pubVideo" aria-label="Vídeo exportado a publicar"></select>
    <input id="pubNetwork" list="pubNetworks" placeholder="rede (instagram, tiktok…)">
    <datalist id="pubNetworks">
      <option value="instagram"></option><option value="tiktok"></option>
      <option value="youtube"></option><option value="comunidade ABRAhub"></option><option value="outro"></option>
    </datalist>
    <input id="pubDate" type="date" aria-label="Data da publicação">
  </div>
  <div class="pb-form">
    <input id="pubUrl" class="grow-lg" placeholder="https://www.instagram.com/reel/…">
    <input id="pubNote" class="grow-md" placeholder="nota livre (o que você testou)">
    <button id="btnPubAdd" class="primary">Registrar publicação</button>
  </div>
</section>

<section class="panel">
  <div class="panel-head">
    <h3><span class="pn">02</span>Publicações e comunidade</h3>
    <div class="row wrap">
      <span id="pubComChip" class="chip mode">0 publicações · comunidade 0/3</span>
    </div>
  </div>
  <div id="pubLog" class="rowlist"></div>
  <div class="row wrap pb-com" id="pubCommunity">
    <label class="inline"><input type="checkbox" data-com="posted"> postei na comunidade</label>
    <label class="inline"><input type="checkbox" data-com="commented"> comentei no trabalho de outra pessoa</label>
    <label class="inline"><input type="checkbox" data-com="feedback"> dei feedback</label>
  </div>
</section>
