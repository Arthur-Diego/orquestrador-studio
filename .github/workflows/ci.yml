name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    # 10 min era o teto original e já vinha raspando: os runs da wave 10 marcaram 8m27s e
    # 9m16s ANTES de a suíte crescer. Com +145 testes (frentes 03 e 04) o job passou de 10
    # min e foi cancelado — falha de orçamento, não de teste. 20 min dá folga real: a suíte
    # roda em ~3,5 min local; o resto é apt-get do ffmpeg, setup do Python e pip.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ffmpeg (fixtures de vídeo/áudio dos testes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check studio tests scripts

      - name: Testes (pytest)
        # Sem rede e sem navegador: os testes cobrem serviços, API e ponte do CLI com fakes.
        run: pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    # Job PARALELO ao build-and-test, não um passo dentro dele. O job Python já roda em ~9-11 min
    # com teto de 20; somar npm ci + tsc + vitest + build ali dentro raspa o teto de novo, e uma
    # falha de frontend passaria a mascarar o tempo do Python. Separado, cada um falha pelo que é.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci
        working-directory: frontend

      - name: Contrato da API (Python só para despejar o /openapi.json)
        # O `schema.ts` é gerado do contrato que o FastAPI publica, então a guarda de drift precisa
        # do app importável. É `requirements.txt` (runtime) e não `-dev`: o que se quer aqui é
        # `app.openapi()`, não a suíte de testes. Pesa ~40 s no job, que tem folga de sobra — e
        # NÃO entra no `build-and-test`, que já roda em 9-11 min com teto de 20.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências do app (para o dump do contrato)
        run: pip install -r requirements.txt

      - name: Drift do contrato tipado (schema.ts × /openapi.json)
        # Falha se alguém mudou uma rota, um modelo Pydantic ou um parâmetro sem regenerar o
        # `frontend/src/api/schema.ts`. O diff sai legível no log: é a lista exata do que mudou.
        # Conserto: `make frontend-schema` e commite o `schema.ts`.
        run: |
          python scripts/gen_openapi.py
          cd frontend && npm run schema:check

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck
        working-directory: frontend

      - name: Lint (eslint)
        run: npm run lint
        working-directory: frontend

      - name: Testes (vitest)
        # jsdom, sem navegador real: a ADR-008 continua valendo (ver emenda na ADR-031).
        run: npm test
        working-directory: frontend

      - name: Build (vite → studio/web/dist/)
        run: npm run build
        working-directory: frontend

      - name: Guarda do dist (versionado e igual ao rebuild)
        # A partir da E10 (card [REACT-11]) o bundle `studio/web/dist/` é VERSIONADO — o usuário final
        # desta ferramenta local não tem Node (ADR-031). Esta guarda (inversão da guarda da wave,
        # wave-10.md §6.1) prova duas coisas: (1) o `dist/` está no git; (2) o rebuild `npm run build`
        # acima bate byte-a-byte com o commitado. Se alguém mexeu no frontend e esqueceu de rodar
        # `make frontend-build` e commitar, o `git status` acusa a divergência e o job falha.
        run: |
          git ls-files --error-unmatch studio/web/dist/index.html >/dev/null 2>&1 || {
            echo "studio/web/dist/ não está versionado. Rode 'make frontend-build' e commite o bundle." >&2
            exit 1
          }
          if [ -n "$(git status --porcelain -- studio/web/dist)" ]; then
            echo "O bundle commitado diverge do rebuild. Rode 'make frontend-build' e commite o dist." >&2
            git status --porcelain -- studio/web/dist >&2
            git diff --stat -- studio/web/dist >&2
            exit 1
          fi
          echo "dist versionado e idêntico ao rebuild."
