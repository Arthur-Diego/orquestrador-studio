name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ffmpeg (fixtures de vídeo/áudio dos testes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check studio tests scripts

      - name: Testes (pytest)
        # Sem rede e sem navegador: os testes cobrem serviços, API e ponte do CLI com fakes.
        run: pytest
